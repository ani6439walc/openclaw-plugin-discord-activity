name: Jules PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  # Large PRs publish a temporary full-diff branch, then remove it after review.
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: jules-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Restrict secrets-backed reviews to the owner and trusted collaborators.
    if: >-
      github.event.pull_request.user.login == github.repository_owner ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Jules PR review
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          python3 .github/scripts/jules_pr_review.py

      - name: Cleanup temporary diff branch
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin --prune
          branches=$(git branch -r | grep -E "origin/temp/pr-${PR_NUMBER}-diff-" | sed 's|^ *origin/||' || true)
          for b in $branches; do
            echo "Cleaning up lingering branch: $b"
            git push origin --delete "$b" || true
          done
